name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # CI 环境没有国服卫月，下载一份 Dalamud 运行库用于编译引用
      - name: Download Dalamud runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ottercorp/dalamud-distrib/main/stg/latest.zip" -OutFile latest.zip
          Expand-Archive -Force latest.zip "dalamud-runtime"

      # 新增插件时，在这里追加一个同样的构建步骤即可（插件目录名与 csproj 同名）
      - name: Build FateTracker
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ github.workspace }}\dalamud-runtime
        run: dotnet build FateTracker/FateTracker.csproj -c Release

      - name: Build FishClock
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ github.workspace }}\dalamud-runtime
        run: dotnet build FishClock/FishClock.csproj -c Release

      - name: Build FriendCompass
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ github.workspace }}\dalamud-runtime
        run: dotnet build FriendCompass/FriendCompass.csproj -c Release

      # 各插件的打包产物都叫 latest.zip，发布前改名为 <插件名>-latest.zip 避免冲突
      - name: Validate FriendCompass manifest description
        shell: pwsh
        run: |
          $manifest = Get-Content FriendCompass/bin/Release/FriendCompass.json -Raw | ConvertFrom-Json
          if (($manifest.Description -split '[ \r\n]+' | Where-Object { $_ }).Count -le 1) { throw "FriendCompass description is too short for Dalamud validation" }

      - name: Run FriendCompass regression checks
        shell: pwsh
        run: dotnet run --project Tests/FriendCompass.Checks/FriendCompass.Checks.csproj -c Release

      - name: Rename packages
        shell: pwsh
        run: |
          Copy-Item FateTracker/bin/Release/FateTracker/latest.zip FateTracker-latest.zip
          Copy-Item FishClock/bin/Release/FishClock/latest.zip FishClock-latest.zip
          Copy-Item FriendCompass/bin/Release/FriendCompass/latest.zip FriendCompass-latest.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            FateTracker-latest.zip
            FishClock-latest.zip
            FriendCompass-latest.zip
          # 新增插件后追加其 <插件名>-latest.zip 路径

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FateTracker-latest.zip
            FishClock-latest.zip
            FriendCompass-latest.zip
          generate_release_notes: true
