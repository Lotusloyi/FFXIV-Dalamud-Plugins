name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # CI 环境没有国服卫月，下载一份 Dalamud 运行库用于编译引用
      - name: Download Dalamud runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -OutFile latest.zip
          Expand-Archive -Force latest.zip "dalamud-runtime"

      # 新增插件时，在这里追加一行即可（插件目录名与 csproj 同名）
      - name: Build FateTracker
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ github.workspace }}\dalamud-runtime
        run: dotnet build FateTracker/FateTracker.csproj -c Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            FateTracker/bin/Release/FateTracker/latest.zip
          # 新增插件后追加其 latest.zip 路径

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FateTracker/bin/Release/FateTracker/latest.zip
          generate_release_notes: true
